# render.yaml – Render Blueprint for one-click deployment
# https://render.com/docs/blueprint-spec

services:
  # ─── FastAPI Backend ───
  - type: web
    name: medical-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medical-db
          property: connectionString
        # Render gives a psycopg2 URL; we convert to asyncpg at app level
      - key: OPENAI_API_KEY
        sync: false   # user must set this manually in the Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: medical-db
    plan: free
    databaseName: medical
    user: medical_user
